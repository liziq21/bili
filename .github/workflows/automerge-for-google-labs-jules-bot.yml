name: Enable Auto-Merge for Jules

on:
  pull_request:
    types: [assigned, opened, reopened, edited, synchronize, review_requested]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
      contains(join(github.event.pull_request.assignees.*.login, ','), 'google-labs-jules[bot]')
    steps:
      - name: Enable GitHub auto-merge for this PR
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
