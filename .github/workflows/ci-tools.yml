# 可复用 workflow：由 ci.yml 调用（on: workflow_call），不直接触发。
# job 名与策略不变。
on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool_tests:
    name: Tool Tests
    runs-on: ubuntu-latest
    # Python 标准库测试，不需要 setup-python。tool/ 下的工具不依赖 Flutter，
    # 所以独立成一个非矩阵 job，不随 Flutter 版本矩阵重复跑。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run tool unit tests
        run: python3 -m unittest discover -s tool -p 'test_*.py' --verbose

      - name: Check test matrix mapping
        run: python3 tool/test_matrix.py --check

      - name: Refresh test matrix document
        run: |
          python3 tool/test_matrix.py --report
          git diff --exit-code -- app/test/TEST_MATRIX.md

  dcm:
    name: Dart Code Metrics
    runs-on: ubuntu-latest
    # DCM requires a license key for CI (DCM_CI_KEY + DCM_EMAIL).
    # Steps are conditional on secrets; job runs but does nothing if secrets missing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: "3.47.9"
          channel: stable
          cache: true

      - name: Install DCM
        run: |
          sudo apt-get update
          wget -qO- https://dcm.dev/pgp-key.public | sudo gpg --dearmor -o /usr/share/keyrings/dcm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/dcm.gpg arch=amd64] https://dcm.dev/debian stable main' | sudo tee /etc/apt/sources.list.d/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y dcm=1.39.1-1
          echo "$(dcm --version)"

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1

      - name: Run dcm analyze
        if: ${{ secrets.DCM_CI_KEY != '' && secrets.DCM_EMAIL != '' }}
        env:
          DCM_CI_KEY: ${{ secrets.DCM_CI_KEY }}
          DCM_EMAIL: ${{ secrets.DCM_EMAIL }}
        run: |
          dcm analyze packages/bilibili packages/bilibili/bpi packages/youtube packages/youtube/ypi packages/data app

      - name: Run dcm check-unused-code
        if: ${{ secrets.DCM_CI_KEY != '' && secrets.DCM_EMAIL != '' }}
        env:
          DCM_CI_KEY: ${{ secrets.DCM_CI_KEY }}
          DCM_EMAIL: ${{ secrets.DCM_EMAIL }}
        run: |
          dcm check-unused-code packages/bilibili packages/bilibili/bpi packages/youtube packages/youtube/ypi packages/data app --exclude-public-api

      - name: Run dcm check-dependencies
        if: ${{ secrets.DCM_CI_KEY != '' && secrets.DCM_EMAIL != '' }}
        env:
          DCM_CI_KEY: ${{ secrets.DCM_CI_KEY }}
          DCM_EMAIL: ${{ secrets.DCM_EMAIL }}
        run: |
          dcm check-dependencies packages/bilibili packages/bilibili/bpi packages/youtube packages/youtube/ypi packages/data app

      - name: DCM skipped notice
        if: ${{ secrets.DCM_CI_KEY == '' || secrets.DCM_EMAIL == '' }}
        run: echo "::notice title=DCM Skipped::DCM_CI_KEY and DCM_EMAIL secrets not configured. Configure them to enable Dart Code Metrics analysis."