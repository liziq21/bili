name: Re-record screenshot baselines

# 手动触发。截图基线只由 CI 产出，这条工作流是唯一的重录入口。
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the baselines need re-recording'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  rerecord:
    # GOLDEN_PR_TOKEN 存放在名为 Actions 的 environment 中。environment 级
    # secret 仅注入声明了该 environment 的 job，未声明时 secrets.GOLDEN_PR_TOKEN
    # 解析为空并回退到 GITHUB_TOKEN。
    environment: Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          # persist-credentials 默认 true，会把 GITHUB_TOKEN 写进 .git/config 的
          # http.extraheader，后续任何 git 命令与第三方 action 都会带上它。关闭后
          # create-pull-request 仍用 token 参数自行配置推送凭证。
          persist-credentials: false

      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Re-record CI goldens
        working-directory: app
        run: flutter test test/golden --update-goldens

      - name: Upload re-recorded screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goldens-${{ github.run_id }}
          path: |
            app/test/golden/goldens/ci/
            app/test/golden/failures/
          if-no-files-found: ignore

      # GITHUB_TOKEN 创建的 PR 不触发 workflow（GitHub 防递归设计，见
      # peter-evans/create-pull-request docs/concepts-guidelines.md
      # "Triggering further workflow runs"）。改用 uhibot 的 installation
      # token：每次运行现生成，无过期；PR 作者是该 App 而非个人账号。
      - name: Create uhibot App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GOLDEN_APP_ID }}
          private-key: ${{ secrets.GOLDEN_APP_PRIVATE_KEY }}

      - name: Open PR with the new baselines
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ci/rerecord-goldens-${{ github.run_id }}
          base: main
          commit-message: 'test(golden): re-record CI baselines from CI'
          title: 'test(golden): re-record CI baselines from CI'
          body: |
            Automated baseline re-record triggered by `${{ github.actor }}`.

            Reason: ${{ inputs.reason }}

            These PNGs were rendered in the CI environment, not on a workstation.
            Review the diff in this PR before merging — a baseline change means
            the rendered output of the covered widgets changed.
          labels: |
            golden
            ci-generated
