# 可复用 workflow：由 ci.yml 调用（on: workflow_call），不直接触发。
# pubspec 矩阵生成 + Run Flutter Test。job 名与矩阵策略保持不变；矩阵版本变更
# 会改变带版本后缀的 check 名，升级 SDK 时必须同步更新 ruleset 的 required check。
on:
  workflow_call:

jobs:
  pubspec:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - id: pubspec
      name: Generate matrix from pubspec.yaml
      uses: flutter-actions/pubspec-matrix-action@a4d3d0f93bf281af6a11f69429b15d90709371dc # v1.3
      with:
        pubspec: 'pubspec.yaml'
    outputs:
      matrix: ${{ steps.pubspec.outputs.matrix }}

  # 共享准备步骤：symbol map、iOS 校验、build_runner、analyze、SARIF
  # 每个 Flutter 版本跑一次，后续测试 job 依赖它
  flutter_test_setup:
    name: Flutter Test Setup
    needs: pubspec
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.pubspec.outputs.matrix)}}
    permissions:
      contents: read
      security-events: write
      actions: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: ${{ matrix.release.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check symbol map
        run: python3 check_symbol_map.py
      - name: Validate iOS project configuration
        run: python3 tool/validate_ios_config.py

      - name: Run build_runner
        run: dart run build_runner build \
          --delete-conflicting-outputs \
          --verbose

      - name: Cache build_runner generated files
        uses: actions/cache@v4
        with:
          path: |
            packages/bilibili/bpi/lib/src/**/*.g.dart
            packages/bilibili/bpi/lib/src/**/*.chopper.dart
            packages/youtube/ypi/lib/src/**/*.g.dart
            packages/youtube/ypi/lib/src/**/*.chopper.dart
          key: build-runner-${{ hashFiles('packages/bilibili/bpi/pubspec.yaml', 'packages/youtube/ypi/pubspec.yaml') }}-${{ github.sha }}
          restore-keys: |
            build-runner-${{ hashFiles('packages/bilibili/bpi/pubspec.yaml', 'packages/youtube/ypi/pubspec.yaml') }}-

      - name: Run analyze
        env:
          IS_JULES_RELATED: ${{ contains(join(github.event.pull_request.assignees.*.login, ','), 'google-labs-jules[bot]') || github.event.pull_request.user.login == 'google-labs-jules[bot]' }}
        run: |
          if [ "$IS_JULES_RELATED" = "true" ]; then
            echo "检测到与 google-labs-jules 相关的 PR，提升警告和一般提示为错误级别..."
            flutter analyze --fatal-infos --fatal-warnings 2>&1 | tee flutter_analyze.txt
          else
            flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee flutter_analyze.txt
          fi

      - name: Dart Analyze to SARIF
        uses: advanced-security/dart-analyzer-sarif@63edda78ee1ce2b3b5bc5b8c0418ce3128887e23 # main
        with:
          input: flutter_analyze.txt
          output: flutter_analyze.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: flutter_analyze.sarif

  # 主测试 job：仅跑 app 测试，保留 "Run Flutter Test" 名称供 ruleset 识别
  flutter_test:
    name: Run Flutter Test
    needs: [pubspec, flutter_test_setup]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.pubspec.outputs.matrix)}}
    permissions:
      contents: read
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: ${{ matrix.release.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run test
        run: flutter test --coverage --branch-coverage
        working-directory: app

      - name: Upload app coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-app-${{ matrix.release.flutter }}
          path: app/coverage/lcov.info
          if-no-files-found: error

      - name: Check coverage threshold
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 tool/check_coverage.py app/coverage/lcov.info
        env:
          MIN_LINES: '60'
          MIN_BRANCHES: '50'

      - name: Upload golden failure diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-failures-${{ github.run_id }}-${{ matrix.release.flutter }}
          path: app/test/golden/failures/
          if-no-files-found: ignore

      - name: Notify golden fix hint
        if: failure()
        run: |
          echo "::notice title=金丝雀测试失败快速修复:: 本地运行 \`flutter test --update-goldens\` 重录基线图片"

      - name: Upload current goldens for visual review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goldens-review-${{ github.run_id }}-${{ matrix.release.flutter }}
          path: app/test/golden/goldens/ci/

  # 包测试并行：matrix 过 (Flutter版本 × 包)，不阻断合并
  flutter_test_packages:
    name: Run Package Tests
    needs: [pubspec, flutter_test_setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ${{fromJson(needs.pubspec.outputs.matrix)}}
        package:
          - { name: bilibili, dir: packages/bilibili, runner: flutter }
          - { name: bpi, dir: packages/bilibili/bpi, runner: dart }
          - { name: youtube, dir: packages/youtube, runner: flutter }
          - { name: ypi, dir: packages/youtube/ypi, runner: dart }
          - { name: data, dir: packages/data, runner: dart }
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: ${{ matrix.flutter.release.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run ${{ matrix.package.name }} tests
        run: |
          if [ "${{ matrix.package.runner }}" = "flutter" ]; then
            cd ${{ matrix.package.dir }} && flutter test --coverage test/
          else
            cd ${{ matrix.package.dir }} && dart test test/ --coverage-path=coverage/lcov.info
          fi

      - name: Upload ${{ matrix.package.name }} coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.package.name }}-${{ matrix.flutter.release.flutter }}
          path: ${{ matrix.package.dir }}/coverage/lcov.info
          if-no-files-found: error

  test_matrix_report:
    name: Test Matrix Report
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: app
            cat: unit
            dir: app
            runner: flutter
          - area: app
            cat: widget
            dir: app
            runner: flutter
          - area: app
            cat: golden
            dir: app
            runner: flutter
          - area: app
            cat: contract
            dir: app
            runner: flutter
          - area: app
            cat: integration
            dir: app
            runner: flutter
          - area: bilibili
            cat: unit
            dir: packages/bilibili
            runner: flutter
          - area: bilibili
            cat: widget
            dir: packages/bilibili
            runner: flutter
          - area: bilibili
            cat: contract
            dir: packages/bilibili
            runner: flutter
          - area: bpi
            cat: unit
            dir: packages/bilibili/bpi
            runner: dart
          - area: bpi
            cat: widget
            dir: packages/bilibili/bpi
            runner: dart
          - area: bpi
            cat: contract
            dir: packages/bilibili/bpi
            runner: dart
          - area: data
            cat: unit
            dir: packages/data
            runner: dart
          - area: data
            cat: widget
            dir: packages/data
            runner: dart
          - area: data
            cat: contract
            dir: packages/data
            runner: dart
          - area: youtube
            cat: unit
            dir: packages/youtube
            runner: flutter
          - area: youtube
            cat: widget
            dir: packages/youtube
            runner: flutter
          - area: youtube
            cat: contract
            dir: packages/youtube
            runner: flutter
          - area: ypi
            cat: unit
            dir: packages/youtube/ypi
            runner: dart
          - area: ypi
            cat: widget
            dir: packages/youtube/ypi
            runner: dart
          - area: ypi
            cat: contract
            dir: packages/youtube/ypi
            runner: dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: fvmrc
        name: Read Flutter version from .fvmrc
        # .fvmrc is multi-line JSON; `cat`ing it into $GITHUB_OUTPUT writes
        # "Invalid format" lines and fails the job. Parse out the value first.
        run: |
          version=$(python3 -c "import json;print(json.load(open('.fvmrc'))['flutter'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: ${{ steps.fvmrc.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run ${{ matrix.area }}/${{ matrix.cat }} tests
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/test-matrix"
          files=$(python3 "$GITHUB_WORKSPACE/tool/test_matrix.py" --files "${{ matrix.cat }}" --area "${{ matrix.area }}" --rel "${{ matrix.dir }}")
          if [ -z "$files" ]; then
            echo "No files for ${{ matrix.area }}/${{ matrix.cat }}, skipping"
            exit 0
          fi
          if [ "${{ matrix.runner }}" = "flutter" ]; then
            cd "$GITHUB_WORKSPACE/${{ matrix.dir }}" && flutter test $files --coverage --coverage-path="$GITHUB_WORKSPACE/test-matrix/${{ matrix.area }}-${{ matrix.cat }}.lcov" --reporter=json > "$GITHUB_WORKSPACE/test-matrix/${{ matrix.area }}-${{ matrix.cat }}.json"
          else
            cd "$GITHUB_WORKSPACE/${{ matrix.dir }}" && dart test $files --coverage-path="$GITHUB_WORKSPACE/test-matrix/${{ matrix.area }}-${{ matrix.cat }}.lcov" --reporter=json > "$GITHUB_WORKSPACE/test-matrix/${{ matrix.area }}-${{ matrix.cat }}.json"
          fi

      - name: Upload category result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-matrix-${{ matrix.area }}-${{ matrix.cat }}-${{ github.run_id }}
          path: |
            test-matrix/${{ matrix.area }}-${{ matrix.cat }}.json
            test-matrix/${{ matrix.area }}-${{ matrix.cat }}.lcov
          if-no-files-found: ignore

  test_matrix_summary:
    name: Test Matrix Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test_matrix_report
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download all category results
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: test-matrix
          pattern: test-matrix-*-${{ github.run_id }}
          merge-multiple: true

      - name: Generate category summary
        run: python3 tool/test_matrix.py --summary test-matrix

      - name: Upload summary report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-matrix-summary-${{ github.run_id }}
          path: test-matrix/summary.md
          if-no-files-found: error