# 可复用 workflow：由 ci.yml 调用（on: workflow_call），不直接触发。
#
# 从 code-scanning.yml 并入：该文件原本独立监听 push/PR，在同一个 commit 上
# 另起一个 check suite。并入后 `scan-skills` 与 ci.yml 的其余 job 同属一个 run。
#
# 这不会消除 main run 上的红叉：实测 suite 内 check run 全为 success 时，
# run 仍判 failure（见 ci.yml 顶部注释）。并入的价值是排查/查看时只有一行。
#
# job 名 `scan-skills` 保持不变，外部按名引用的地方（如 docs/postmortems）
# 不受影响。
on:
  workflow_call:

jobs:
  scan_skills:
    name: scan-skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - run: dart install skills_lint
      - run: echo "$HOME/.local/state/Dart/install/bin" >> $GITHUB_PATH

      # The linter exits 1 when it finds violations. continue-on-error
      # lets the upload step run first, so findings reach Code Scanning
      # instead of disappearing with the failed job.
      - name: Generate SARIF report
        id: lint
        continue-on-error: true
        run: skills_lint --skills-directory ./.agents/skills --format=sarif > skills-lint.sarif

      # Pull requests from forks cannot write security events, so skip
      # the upload there rather than failing the job on a permission
      # error.
      - name: Upload SARIF report
        if: ${{ !cancelled() && steps.lint.conclusion != 'skipped' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: skills-lint.sarif
          category: skills_lint

      - name: Fail on lint violations
        if: steps.lint.outcome != 'success'
        run: exit 1
