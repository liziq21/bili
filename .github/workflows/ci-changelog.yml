# 可复用 workflow：由 ci.yml 调用（on: workflow_call），不直接触发。
#
# 从 changelog.yml 并入：该文件原本独立监听 push/main，在合入 commit 上另起
# 一个 check suite。并入后 `update-changelog` 与 ci.yml 的其余 job 同属一个 run。
#
# `environment: Actions` 是必需的：GOLDEN_APP_PRIVATE_KEY 是 environment 级
# secret，只有声明了该 environment 的 job 才能读到（同 rerecord-goldens.yml）。
# 官方要求 environment 写在被调用 workflow 的 job 上，调用方不能声明。
#
# 调用方还必须写 `secrets: inherit`：environment secret 不会自动穿透到可复用
# workflow，缺失时它在被调用方静默变成空字符串且不报错（官方文档明示），
# 直到 create-github-app-token 才抛 `privateKey option is required`
# （实测 main run 43015095349）。
on:
  workflow_call:

jobs:
  update_changelog:
    name: update-changelog
    environment: Actions
    runs-on: ubuntu-latest
    # 用 uhibot App token 写分支并开 PR，不依赖 GITHUB_TOKEN 的写权限。
    # ci.yml 顶层是 contents: read，这里按需就地提权。
    permissions:
      contents: write
      pull-requests: write
    # 触发面是「仅 push 到 main」，但**不能**用 job 级 `if` 表达：
    # job 级 `if` 为假时该 job 是 `skipped`，而 skipped 的 job 会把整个 run
    # 的 conclusion 拉成 `failure` —— PR 上每次 run 都会变红（实测 PR #548：
    # 11 个 job 中 8 success / 3 skipped / 0 failure，run 仍判 failure）。
    # 因此 job 恒运行，用 step 级 `if` 在 PR 上走空步骤快速通过。
    steps:
      - name: Skip outside main pushes
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: echo "Not a push to main (event=$EVENT_NAME, ref=$REF); skipping changelog."

      - name: Check out full history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 生成器要读 tag 列表和每个 tag 的提交日期，浅克隆拿不到。
          fetch-depth: 0
          # 关闭后 GITHUB_TOKEN 不写进 git config，推送凭证由 remote URL 内嵌。
          persist-credentials: false

      - name: Rebuild CHANGELOG.md
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/generate_changelog.py

      - name: Create uhibot App token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GOLDEN_APP_ID }}
          private-key: ${{ secrets.GOLDEN_APP_PRIVATE_KEY }}

      - name: Commit and push changelog branch + open PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # 生成器只在内容变化时写文件；无变化直接跳过。
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is up to date, nothing to push"
            exit 0
          fi
          git config user.name "uhibot[bot]"
          git config user.email "uhibot[bot]@users.noreply.github.com"

          BRANCH="ci/changelog"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs: regenerate CHANGELOG.md from merged pull requests"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force-with-lease -u origin "$BRANCH"

          # Open PR (idempotent: if PR exists for this branch, gh exits 0)
          gh pr create \
            --title "docs: regenerate CHANGELOG.md from merged pull requests" \
            --body "Automated changelog regeneration from merged PRs since last tag." \
            --base main \
            --head "$BRANCH" \
            --label "c: process" || true
