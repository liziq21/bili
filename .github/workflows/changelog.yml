name: Changelog

# main 每次合入后重跑生成器，把 CHANGELOG.md 的差异直接推回 main。
#
# 触发源是合入动作而不是定时器：变更内容只在有人合入 PR 时才变，
# 定时轮询既慢又会重复空跑（仓库现无任何 cron）。
#
# 直推而非开 PR（2026-10-28 改）：changelog 是生成器产出的派生文件，开 PR
# 会走全套门禁——main 上任何 required check 变红（如 #487 被 Run Flutter
# Test 腿阻塞）都会让 changelog 永久停更。生成器只读已合入 PR 与 git tag、
# 无编译依赖，直推不引入新风险；ruleset 23869296 无拦直推的 push 规则，
# uhibot App token 具备 contents:write。直推会再次触发本 workflow，
# 生成器发现无差异即跳过，两轮内收敛，无自喂链。
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    # GOLDEN_APP_PRIVATE_KEY 存放在名为 Actions 的 environment 中，environment
    # 级 secret 仅注入声明了该 environment 的 job（同 rerecord-goldens.yml）。
    environment: Actions
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 生成器要读 tag 列表和每个 tag 的提交日期，浅克隆拿不到。
          fetch-depth: 0
          # 关闭后 GITHUB_TOKEN 不写进 git config，推送凭证由 remote URL 内嵌。
          persist-credentials: false

      - name: Rebuild CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/generate_changelog.py

      - name: Create uhibot App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GOLDEN_APP_ID }}
          private-key: ${{ secrets.GOLDEN_APP_PRIVATE_KEY }}

      - name: Commit and push to main
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # 生成器只在内容变化时写文件；无变化直接跳过，不产生空提交。
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is up to date, nothing to push"
            exit 0
          fi
          git config user.name "uhibot[bot]"
          git config user.email "uhibot[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: regenerate CHANGELOG.md from merged pull requests"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:refs/heads/main
