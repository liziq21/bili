name: Changelog

# main 每次合入后重跑生成器，把 CHANGELOG.md 的差异开成 PR。
# 触发源是合入动作而不是定时器：变更内容只在有人合入 PR 时才变，
# 定时轮询既慢又会重复空跑（仓库现无任何 cron）。
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    # GOLDEN_APP_PRIVATE_KEY 存放在名为 Actions 的 environment 中，environment
    # 级 secret 仅注入声明了该 environment 的 job（同 rerecord-goldens.yml）。
    environment: Actions
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 生成器要读 tag 列表和每个 tag 的提交日期，浅克隆拿不到。
          fetch-depth: 0
          # 关闭后 GITHUB_TOKEN 不写进 git config，推送凭证由 create-pull-request
          # 的 token 参数自行配置。
          persist-credentials: false

      - name: Rebuild CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/generate_changelog.py

      # GITHUB_TOKEN 创建的 PR 不触发 workflow（GitHub 防递归设计，见
      # peter-evans/create-pull-request docs/concepts-guidelines.md
      # "Triggering further workflow runs"）。改用 uhibot 的 installation
      # token，否则这个 PR 不会有 check run，直接被 ruleset 挡在合并之外。
      # secret 复用 rerecord-goldens.yml 的同一对 App 凭据。
      - name: Create uhibot App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GOLDEN_APP_ID }}
          private-key: ${{ secrets.GOLDEN_APP_PRIVATE_KEY }}

      - name: Open PR with the regenerated changelog
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        id: cpr
        with:
          token: ${{ steps.app-token.outputs.token }}
          # 固定分支名：生成器无改动时不产生 diff，create-pull-request 不建 PR，
          # 有改动时复用同一个分支更新既有 PR，而不是每次合入都堆一条新 PR。
          branch: ci/changelog
          base: main
          add-paths: CHANGELOG.md
          commit-message: 'docs: regenerate CHANGELOG.md from merged pull requests'
          title: 'docs: regenerate CHANGELOG.md from merged pull requests'
          body: |
            Regenerated by `tool/generate_changelog.py` after `${{ github.actor }}` pushed to `main`.

            The file is rebuilt from git tags and the GitHub pulls API, so it carries
            no hand-written prose and hand edits do not survive the next run. Review
            this diff when the bucketing looks wrong, and fix the generator rather
            than this file.
          labels: |
            ci-generated

      - name: Enable auto-merge for the changelog PR
        if: ${{ steps.cpr.outputs.pull-request-number != '' }}
        run: |
          gh api graphql \
            -f query='mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){clientMutationId}}' \
            -F id="${{ steps.cpr.outputs.pull-request-node-id }}" >/dev/null
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}