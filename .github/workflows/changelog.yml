name: Changelog

# main 每次合入后重跑生成器，把 CHANGELOG.md 的差异提交到 changelog 分支并开 PR。
#
# 触发源是合入动作而不是定时器：变更内容只在有人合入 PR 时才变，
# 定时轮询既慢又会重复空跑（仓库现无任何 cron）。
#
# 开 PR 而非直推：符合 LIZ-124 验收标准（自动生成、开 PR），且 ruleset
# 23869296 允许 uhibot App token 推送功能分支。生成器排除 ci/changelog 分支
# 产出的 PR，合入后不再触发二次生成，无自喂链。
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    # GOLDEN_APP_PRIVATE_KEY 存放在名为 Actions 的 environment 中，environment
    # 级 secret 仅注入声明了该 environment 的 job（同 rerecord-goldens.yml）。
    environment: Actions
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 生成器要读 tag 列表和每个 tag 的提交日期，浅克隆拿不到。
          fetch-depth: 0
          # 关闭后 GITHUB_TOKEN 不写进 git config，推送凭证由 remote URL 内嵌。
          persist-credentials: false

      - name: Rebuild CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/generate_changelog.py

      - name: Create uhibot App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GOLDEN_APP_ID }}
          private-key: ${{ secrets.GOLDEN_APP_PRIVATE_KEY }}

      - name: Commit and push changelog branch + open PR
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # 生成器只在内容变化时写文件；无变化直接跳过。
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is up to date, nothing to push"
            exit 0
          fi
          git config user.name "uhibot[bot]"
          git config user.email "uhibot[bot]@users.noreply.github.com"

          BRANCH="ci/changelog"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs: regenerate CHANGELOG.md from merged pull requests"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          git push -u origin "$BRANCH"

          # Open PR (idempotent: if PR exists for this branch, gh exits 0)
          gh pr create \
            --title "docs: regenerate CHANGELOG.md from merged pull requests" \
            --body "Automated changelog regeneration from merged PRs since last tag." \
            --base main \
            --head "$BRANCH" \
            --label "c: process" || true