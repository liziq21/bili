name: CI

on:
  push:
    branches:
      - main
  # target 分支不限：rerecord-goldens.yml 在功能分支上录出的基线 PR 目标不是 main，
  # 限定 [main] 会让这类 PR 跳过全部检查，可以无门禁合入。
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pubspec:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - id: pubspec
      name: Generate matrix from pubspec.yaml
      uses: flutter-actions/pubspec-matrix-action@a4d3d0f93bf281af6a11f69429b15d90709371dc # v1.3
      with:
        pubspec: 'pubspec.yaml'
    outputs:
      matrix: ${{ steps.pubspec.outputs.matrix }}

  flutter_test:
    name: Run Flutter Test
    needs: pubspec
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.pubspec.outputs.matrix)}}
    permissions:
      contents: write # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: ${{ matrix.release.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run build_runner
        run: flutter pub run build_runner build \
          --delete-conflicting-outputs \
          --verbose
          
      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: Update generated files [skip ci]"
            git push --force origin HEAD:build_runner
          else
            echo "No changes to commit"
          fi

      - name: Run analyze
        env:
          IS_JULES_RELATED: ${{ contains(join(github.event.pull_request.assignees.*.login, ','), 'google-labs-jules[bot]') || github.event.pull_request.user.login == 'google-labs-jules[bot]' }}
        run: |
          if [ "$IS_JULES_RELATED" = "true" ]; then
            echo "检测到与 google-labs-jules 相关的 PR，提升警告和一般提示为错误级别..."
            flutter analyze --fatal-infos --fatal-warnings 2>&1 | tee flutter_analyze.txt
          else
            flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee flutter_analyze.txt
          fi
      
      - name: Dart Analyze to SARIF
        uses: advanced-security/dart-analyzer-sarif@63edda78ee1ce2b3b5bc5b8c0418ce3128887e23 # main
        with:
          input: flutter_analyze.txt
          output: flutter_analyze.sarif
      
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: flutter_analyze.sarif
      
      - name: Run test
        run: flutter test
        working-directory: app

      - name: Run bilibili package test
        if: ${{ !cancelled() }}
        run: flutter test test/
        working-directory: packages/bilibili

      - name: Run bpi test
        if: ${{ !cancelled() }}
        run: flutter test test/
        working-directory: packages/bilibili/bpi

      - name: Run youtube package test
        if: ${{ !cancelled() }}
        run: flutter test test/
        working-directory: packages/youtube

      - name: Run ypi test
        if: ${{ !cancelled() }}
        run: flutter test test/
        working-directory: packages/youtube/ypi

      - name: Upload golden failure diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-failures-${{ github.run_id }}-${{ matrix.release.flutter }}
          path: app/test/golden/failures/
          if-no-files-found: ignore

      - name: Upload current goldens for visual review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goldens-review-${{ github.run_id }}-${{ matrix.release.flutter }}
          path: app/test/golden/goldens/ci/


  format_check:
    name: Check Formatting
    runs-on: ubuntu-latest
    # 只读代码即可。setup-flutter 的 cache 用的是 Actions 自己的 runtime token，
    # 不依赖 GITHUB_TOKEN 权限（同 rerecord-goldens.yml 的用法）。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 默认 true 会把 GITHUB_TOKEN 写进 .git/config 的 http.extraheader，
          # 后续任何 git 命令都带上它。门禁只跑 dart format，不需要 git 凭据。
          persist-credentials: false

      # Pinned to the single version in .fvmrc rather than the pubspec matrix.
      # `dart format` output changes between SDK releases (dart_style ships
      # style fixes that are not language-versioned, including in patch
      # releases), so running this across matrix versions would make the gate
      # itself flaky. The gate exists to stop unformatted code from landing,
      # and one authoritative version is enough for that.
      - id: fvmrc
        name: Read pinned SDK version
        run: |
          version=$(python3 -c "import json;print(json.load(open('.fvmrc'))['flutter'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: ${{ steps.fvmrc.outputs.version }}
          channel: stable
          cache: true

      - name: Report pinned SDK
        run: |
          echo "flutter=$(flutter --version --machine | head -c 200)"
          dart --version

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

  build_androidApp:
    name: Build Flutter App (android)
    needs: [pubspec, flutter_test]
    runs-on: ubuntu-latest
    permissions: write-all
    strategy:
      matrix: ${{fromJson(needs.pubspec.outputs.matrix)}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/**/gradle-wrapper.properties
      
      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: ${{ matrix.release.flutter }}
          channel: stable
          cache: true
      
      - name: Get Packages
        run: flutter pub get

      - name: Run build_runner
        run: flutter pub run build_runner build \
          --delete-conflicting-outputs \
          --verbose
      
      # CI has no release keystore, so BILI_ALLOW_UNSIGNED_RELEASE lets the release
      # build fall back to the debug keystore to verify that the variant compiles.
      # The resulting artifact is not publishable. Release builds outside CI must
      # supply android/key.properties or they fail (see app/android/app/build.gradle.kts).
      - name: Build release APK (unsigned)
        run: cd app && flutter build apk --release --split-per-abi --pub --build-number=${{ github.run_number }}
        env:
          BILI_ALLOW_UNSIGNED_RELEASE: "1"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-arm64-v8a-release-unsigned.apk
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk


