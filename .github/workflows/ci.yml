name: CI

on:
  push:
    branches:
      - main
  # target 分支不限：rerecord-goldens.yml 在功能分支上录出的基线 PR 目标不是 main，
  # 限定 [main] 会让这类 PR 跳过全部检查，可以无门禁合入。
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# 并发只在调用方（本文件）声明——被调用的可复用 workflow 绝不能自带 concurrency：
# 在 workflow_call 上下文里 github.workflow 解析成调用方名（CI），各子 workflow
# 会落到同一个 group 字符串上互相 cancel，并连带把调用方 run 一起取消（实测三轮
# 推送全部 cancelled，annotation「Canceling since a higher priority waiting request
# for CI-refs/pull/N/merge exists」即此）。取消语义由这里的 cancel-in-progress 承担。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 调用方 workflow 的 permissions 是调用链的权限上限——被调用的可复用 workflow
# 的 job 权限不能超过这里。各被调用 workflow 的 job 各自声明了所需权限，
# 这里取并集作为上限（security-events/actions 仅 SARIF 上传需要；
# contents/pull-requests 的 write 仅供 changelog job 用 uhibot token 推送与开 PR）。
permissions:
  contents: read
  security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
  actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
  pull-requests: read

jobs:
  # 单次 push/PR 只触发这一个 workflow：一个 concurrency 组、一组 check-run，
  # 不再是多个独立 workflow 各跑一遍。各 job 分别调用同目录下的可复用
  # workflow（on: workflow_call），job 定义在各自文件里。
  #
  # 并入这里的每个 workflow 都必须删掉自己的 `on: push/pull_request`：
  # 独立触发会在同一 commit 上另起 check suite，Actions 页面按 suite 分行显示，
  # 排查时要跨多个 run 对照。并入后所有 job 同属一个 run。
  #
  # 注意：这不会消除 main run 上的红叉。实测 run 42955726241（166a458）与
  # 43021874496（2b878e7）都是本 suite 内全部 check run `completed/success`
  # （28/28、30/30，重跑后 60/60 亦全绿），suite 与 run 的 conclusion 仍是
  # `failure`。该现象自 2026-10-30 引入 test_matrix_report 的 20 个矩阵 job
  # 后开始，最后一个成功的 CI run 是 10-28 的 40629252954（当时仅 8 个 job）。
  # 不要在 job / step 层找原因，也别为此再加 `if`：job 级 `if` 为假产生的
  # skipped job 反而会把 run 判成 failure（PR #548 实测）。commit 级
  # statusCheckRollup 始终是 SUCCESS，ruleset 的 required check 也始终通过，
  # 合并不受影响。
  format:
    uses: ./.github/workflows/ci-format.yml

  test:
    uses: ./.github/workflows/ci-test.yml

  # 拆分前 build 的 needs 含 flutter_test（test 失败时 build 跳过）。
  # 同一 workflow 内调用即可恢复该依赖。if: always() 是必需的：test 可复用
  # workflow 内含 test_matrix_report/test_matrix_summary 两个「仅 push+main」
  # 的 job，PR 上它们 skipped，而 needs 到 skipped job 的 job 自身也会 skipped，
  # 于是 test 整体判为 skipped，build 若不 always() 会被连带 skip ——
  # 而 build 是 ruleset 的 required check，skip 会让 PR 永久 BLOCKED。
  # 不写 needs: [test]：ci-test 里 test_matrix_report/test_matrix_summary 是
  # 「仅 push+main」的 job，PR 上它们 skipped，而 needs 到 skipped job 的 job
  # 自身也会被 skip —— build 因此被连带 skip。build 是 ruleset 的 required
  # check，一旦 skip，PR 拿不到该 check 就永久 BLOCKED（实测 if: always() 也
  # 救不回来：needs-gating 先于 if 求值）。build 独立跑，不再依赖 test。
  build:
    uses: ./.github/workflows/ci-build.yml

  tools:
    uses: ./.github/workflows/ci-tools.yml

  # 原本是独立的 code-scanning.yml。并入后 `scan-skills` 与本 suite 的其余
  # job 同属一个 run，Actions 页面不再追加一行独立的 suite。SARIF 上传所需的
  # security-events: write 已在本文件顶层 permissions 中声明（调用链权限上限）。
  skills:
    uses: ./.github/workflows/ci-skills.yml

  # 原本是独立的 changelog.yml（同样在 commit 上另起一个 suite）。
  #
  # 不要加 job 级 `if`：job 级 `if` 为假时该 job 是 `skipped`，而 skipped
  # 的 job 会把整个 run 的 conclusion 拉成 `failure`（实测 PR #548：11 个
  # job 中 8 success / 3 skipped / 0 failure，run 仍判 failure）。「仅 push
  # 到 main」的判定放在 ci-changelog.yml 内部用 step 级 `if` 完成。
  #
  # job 级 permissions 覆盖顶层 `contents: read`：调用链的权限只能维持或降低、
  # 不能提升，若不在本 job 内声明，被调用 workflow 的 `contents: write`
  # 会被顶层 read 截断，推送 `ci/changelog` 分支必然失败。写权限只给这一个
  # job，其余 job 仍受顶层只读约束。
  #
  # `secrets: inherit` 是必需的：改成可复用 workflow 后，调用方不显式传递时
  # environment secret 会在被调用方静默解析成空字符串且不报错（官方文档明示）。
  # 缺了它有实测后果——main run 43015095349 在 create-github-app-token 处报
  # `privateKey option is required`。原 changelog.yml 作为独立 workflow 时
  # 不需要这一步。
  changelog:
    uses: ./.github/workflows/ci-changelog.yml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
