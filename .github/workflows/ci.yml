name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pubspec:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - id: pubspec
      name: Generate matrix from pubspec.yaml
      uses: flutter-actions/pubspec-matrix-action@a4d3d0f93bf281af6a11f69429b15d90709371dc # v1.3
      with:
        pubspec: 'pubspec.yaml'
    outputs:
      matrix: ${{ steps.pubspec.outputs.matrix }}

  flutter_test:
    name: Run Flutter Test
    needs: pubspec
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.pubspec.outputs.matrix)}}
    permissions:
      contents: write # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: ${{ matrix.release.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run build_runner
        run: flutter pub run build_runner build \
          --delete-conflicting-outputs \
          --verbose
          
      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: Update generated files [skip ci]"
            git push --force origin HEAD:build_runner
          else
            echo "No changes to commit"
          fi

      - name: Run analyze
        env:
          IS_JULES_RELATED: ${{ contains(join(github.event.pull_request.assignees.*.login, ','), 'google-labs-jules[bot]') || github.event.pull_request.user.login == 'google-labs-jules[bot]' }}
        run: |
          if [ "$IS_JULES_RELATED" = "true" ]; then
            echo "检测到与 google-labs-jules 相关的 PR，提升警告和一般提示为错误级别..."
            flutter analyze --fatal-infos --fatal-warnings > flutter_analyze.txt
          else
            flutter analyze --no-fatal-infos --no-fatal-warnings > flutter_analyze.txt
          fi
      
      - name: Dart Analyze to SARIF
        uses: advanced-security/dart-analyzer-sarif@63edda78ee1ce2b3b5bc5b8c0418ce3128887e23 # main
        with:
          input: flutter_analyze.txt
          output: flutter_analyze.sarif
      
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: flutter_analyze.sarif
      
      - name: Run test
        run: cd app && flutter test


  build_androidApp:
    name: Build Flutter App (android)
    needs: [pubspec, flutter_test]
    runs-on: ubuntu-latest
    permissions: write-all
    strategy:
      matrix: ${{fromJson(needs.pubspec.outputs.matrix)}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/**/gradle-wrapper.properties
      
      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: ${{ matrix.release.flutter }}
          channel: stable
          cache: true
      
      - name: Get Packages
        run: flutter pub get

      - name: Run build_runner
        run: flutter pub run build_runner build \
          --delete-conflicting-outputs \
          --verbose
      
      - run: cd app && flutter build apk --release --split-per-abi --pub

      - name: Upload APK as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-arm64-v8a-release.apk
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk


