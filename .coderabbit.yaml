language: "zh-CN"

reviews:
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # 0 disables CodeRabbit's automatic review pause. Whether this status is
    # required is controlled by the GitHub ruleset, not by this file.
    auto_pause_after_reviewed_commits: 0
    ignore_usernames:
      - "n24q02m"
      - "dependabot[bot]"
      - "renovate[bot]"
      - "github-actions[bot]"
      # - "devin-ai-integration[bot]"
      # - "google-labs-jules[bot]"
  profile: "chill"
  
  # 当 CodeRabbit 评审发现问题（如严重 Bug、安全隐患）时，会向 PR 提交 "Request Changes" 状态。
  request_changes_workflow: true
  
  # Publish a commit status so GitHub rulesets can require the review result.
  commit_status: true
  
  high_level_summary: true

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true

chat:
  auto_reply: false
