name: f_biuli
description: A new Flutter project.
publish_to: 'none'

# Flutter and Dart SDK version constraints for the project and CI workflow matrix generation.
# flutter-actions/pubspec-matrix-action and subosito/flutter-action parse this file to determine Flutter version.
environment:
  sdk: "^3.13.0"
  flutter: ">=3.47.0"

workspace:
  - app
  - packages/*

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
dependencies:
  flutter:
    sdk: flutter

