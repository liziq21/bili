name: youtube
description: YouTube API wrapper and remote data source.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: "^3.13.4"
  flutter: ">=3.47.5"

resolution: workspace

workspace:
  - ypi

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  data:
    path: ../data
  model:
    path: ../model
  ypi:
    path: ypi
  material_ui: ^1.2.0
  meta: ^1.12.0
  equatable: ^3.0.0
  http: ^1.6.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: any
  build_runner: ^2.15.1

flutter:
  generate: true
