name: youtube
description: YouTube API wrapper and remote data source.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

resolution: workspace

workspace:
  - ypi

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  data: ^1.0.0
  model: ^1.0.0
  ypi: ^1.0.0
  meta: ^1.12.0
  equatable: ^2.0.7
  http: ^1.6.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: any
  build_runner: ^2.15.1

flutter:
  generate: true
