<?xml version="1.0" encoding="UTF-8"?>
<!--
  Foreground layer of the Bili brand icon: the oracle-bone eye alone, on a
  transparent ground, inside the 108dp adaptive-icon viewport. The mark stays
  within the 72dp safe zone (x 23..85, y 37..71 including the miter tips) so
  no launcher mask clips it. Doubles as the Android monochrome (themed) icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108"
     viewBox="0 0 108 108" role="img" aria-labelledby="title">
  <title id="title">Bili brand mark</title>
  <path d="M23 54 L39.5 37 H68.5 L85 54 L68.5 71 H39.5 Z"
        fill="none" stroke="#B75B1E" stroke-width="7.5"
        stroke-linejoin="miter" stroke-linecap="butt"/>
  <path d="M45 43 L45 65 L63.5 54 Z" fill="#B75B1E"/>
</svg>
