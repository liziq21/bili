name: app
description: A starting point for Dart libraries or applications.
# Runtime source of truth for the app version. The build name (X.Y.Z) is
# user-facing and must match the release tag; the build number (+N) is injected
# by CI (`--build-number=${{ github.run_number }}`) and is not committed per build.
# See .github/workflows/release.yml for the tag/pubspec consistency check.
version: 0.1.0+1
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
# repository: https://github.com/my_org/my_repo

environment:
  sdk: "^3.14.0"
  flutter: ">=3.50.0"
resolution: workspace

# Add regular dependencies here.
dependencies:

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  bilibili:
    path: ../packages/bilibili
  youtube:
    path: ../packages/youtube
  bloc: ^9.2.1
  cached_network_image_ce: ^4.10.0
  clock: ^1.1.2
  data:
    path: ../packages/data
  dynamic_color: ^2.1.0
  flutter_bloc: ^9.1.1
  flutter_debug_overlay: ^0.2.0
  go_router: ^18.0.1
  infinite_scroll_pagination: ^6.0.0
  intl: any
  logging:  ^1.3.0
  meta: any
  model:
    path: ../packages/model
  provider: ^6.1.5+1
  window_size: ^0.2.0
  stream_transform: ^2.1.1
  material_ui: ^1.2.0
  shared_preferences: ^2.5.6
  shared_preferences_platform_interface: ^2.4.2
  shared_preferences_android: ^2.5.5
  equatable: ^2.1.0
  drift: ^2.30.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  sqlite3: ^3.9.2
  http: ^1.6.0
  internet_connection_checker: ^3.0.1
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  sized_context: ^1.0.0+4
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  flutter_local_notifications: ^23.0.0
  characters: ^1.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  lints: ^6.0.0
  test: any
  drift_dev: ^2.30.0
  build_runner: ^2.15.1
  # 4.4.0 and below don't support Dart 3.13. Route data classes must use named
  # constructors instead of primary constructor syntax
  # (class const Foo({...}) extends ...).
  go_router_builder: ^4.5.0
  alchemist: ^0.15.0
  # Transitive dependency of flutter_test, declared here because
  # app/test/flutter_test_config.dart imports it directly to enable leak
  # tracking. Version constraint matches the one flutter_test pins.
  leak_tracker_flutter_testing: ^3.0.10
  # Transitive dependency of flutter_test, declared here because
  # app/test/feature/live_bloc_test.dart drives periodic timers in a
  # fake-async zone. Keep the constraint in step with flutter_test's pin.
  fake_async: ^1.3.3
  network_image_mock: ^2.1.1
  path_provider_platform_interface: ^2.1.3
  # G1 门禁（app/test/design/hardcoded_color_test.dart）用 AST 扫描 app/lib，
  # 不走 custom_lint：后者最新 0.8.1 钉 analyzer ^8.0.0，与本仓的 analyzer 14.x
  # 无解；降到 8 又解析不了 primary constructor 语法。drift_dev 2.35.x 钉
  # analyzer <15.0.0，升级 analyzer 前先确认它放开该上限。
  analyzer: ^14.7.0

flutter:
  generate: true
  uses-material-design: true
