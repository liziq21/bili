name: app
description: A starting point for Dart libraries or applications.
version: 1.0.0
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
# repository: https://github.com/my_org/my_repo

environment:
  sdk: "^3.13.4"
  flutter: ">=3.47.5"
resolution: workspace

# Add regular dependencies here.
dependencies:

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bilibili:
    path: ../packages/bilibili
  youtube:
    path: ../packages/youtube
  bloc: ^9.2.1
  cached_network_image_ce: ^4.10.0
  data:
    path: ../packages/data
  dynamic_color: ^2.1.0
  flutter_bloc: ^9.1.1
  flutter_debug_overlay: ^0.1.11
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  infinite_scroll_pagination: ^5.1.1
  intl: any
  logging:  ^1.3.0
  meta: any
  model:
    path: ../packages/model
  multiple_result: ^5.3.0
  provider: ^6.1.5+1
  window_size: ^0.2.0
  stream_transform: ^2.1.1
  material_ui: 1.3.0
  shared_preferences: ^2.5.4
  equatable: any
  drift: ^2.30.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  sqlite3: "<3.7.0"
  http: ^1.6.0
  internet_connection_checker: ^3.0.1
  sized_context: ^1.0.0+4
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: any
  drift_dev: ^2.30.0
  build_runner: ^2.15.1
  # 4.4.0 and below don't support Dart 3.13. Do not override analyzer to ^14.0.0
  # (would break drift_dev 2.34.0). Route data classes must use named constructors
  # instead of primary constructor syntax (class const Foo({...}) extends ...).
  go_router_builder: ^4.5.0

flutter:
  generate: true
  uses-material-design: true
